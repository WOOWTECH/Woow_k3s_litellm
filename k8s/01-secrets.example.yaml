# -----------------------------------------------------------------------------
# EXAMPLE SECRETS — PLACEHOLDERS ONLY. DO NOT COMMIT REAL VALUES.
#
# Copy to a private location, replace every REPLACE_ME_* value, then apply:
#   kubectl apply -f 01-secrets.yaml
#
# The live cluster already has these Secrets populated with real values.
# This file documents the required keys so the repo is the source of truth.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: litellm
  labels:
    app: litellm
type: Opaque
stringData:
  # Real OpenRouter key already lives in the cluster Secret.
  # Config references it as: api_key: os.environ/OPENROUTER_API_KEY
  OPENROUTER_API_KEY: "REPLACE_ME_OPENROUTER_API_KEY"
  # LiteLLM admin / master key (sk-...). Used for admin API + Admin UI.
  LITELLM_MASTER_KEY: "REPLACE_ME_sk-master-key"
  # Encrypts provider credentials stored in the DB. SET ONCE, NEVER CHANGE.
  LITELLM_SALT_KEY: "REPLACE_ME_sk-salt-key"
  # Postgres connection string consumed by LiteLLM for readiness DB check.
  # Host is the headless postgres Service below.
  DATABASE_URL: "postgresql://litellm:REPLACE_ME_PG_PASSWORD@litellm-postgres:5432/litellm"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-postgres-secret
  namespace: litellm
  labels:
    app: litellm-postgres
type: Opaque
stringData:
  POSTGRES_USER: "litellm"
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  POSTGRES_DB: "litellm"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: litellm
  labels:
    app: cloudflared
type: Opaque
stringData:
  # Token for the EXISTING Cloudflare tunnel fronting https://litellm.woowtech.io
  # Reuse the existing tunnel token; do not create a new tunnel.
  TUNNEL_TOKEN: "REPLACE_ME_CLOUDFLARE_TUNNEL_TOKEN"
