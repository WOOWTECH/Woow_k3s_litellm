# -----------------------------------------------------------------------------
# LiteLLM proxy (OpenAI-compatible API on :4000, Admin UI at /ui).
#
# - DISABLE_SCHEMA_UPDATE=false: the proxy runs `prisma migrate deploy` on start.
#   With "true" an empty database never gets its tables. With one replica and
#   maxSurge 1, only the new pod migrates, so there is no migration race.
# - startupProbe: up to 40 x 15s = 10 min for first-boot migrations, after which
#   readiness (/health/readiness, DB-aware) and liveness (/health/liveliness,
#   process-only) take over. Never probe /health - it calls every model and costs money.
# - Probe timeouts are 10s; 1s timeouts caused false restarts elsewhere on woow-k3s.
# - The initContainer waits on pg_isready, not a bare TCP check.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
    app: litellm
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: litellm
        app.kubernetes.io/part-of: woow-litellm
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
      - name: wait-for-postgres
        image: docker.io/library/postgres:16-alpine
        command:
        - sh
        - -c
        - |
          until pg_isready -h litellm-postgres -p 5432 -U litellm -d litellm; do
            echo "waiting for postgres..."; sleep 3;
          done
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
      containers:
      - name: litellm
        image: ghcr.io/berriai/litellm:v1.83.14-stable
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /etc/litellm/config.yaml
        - --port
        - '4000'
        ports:
        - name: http
          containerPort: 4000
        envFrom:
        - secretRef:
            name: litellm-secrets
        env:
        - name: STORE_MODEL_IN_DB
          value: 'True'
        - name: LITELLM_MODE
          value: PRODUCTION
        - name: LITELLM_LOG
          value: ERROR
        - name: DISABLE_SCHEMA_UPDATE
          value: 'false'
        volumeMounts:
        - name: config
          mountPath: /etc/litellm
          readOnly: true
        startupProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 40
        readinessProbe:
          httpGet:
            path: /health/readiness
            port: 4000
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /health/liveliness
            port: 4000
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '2'
            memory: 2Gi
      volumes:
      - name: config
        configMap:
          name: litellm-config
          items:
          - key: config.yaml
            path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
    app: litellm
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
  - name: http
    port: 4000
    targetPort: 4000
