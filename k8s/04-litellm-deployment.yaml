# -----------------------------------------------------------------------------
# LiteLLM proxy Deployment + Service (litellm:4000).
# Matches the live k3s deployment (namespace litellm, label app=litellm).
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: litellm
    spec:
      initContainers:
        # Block startup until Postgres is accepting TCP connections so the
        # proxy's first DB call (readiness) does not crash-loop.
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for litellm-postgres:5432 ..."
              until nc -z litellm-postgres 5432; do
                echo "postgres not ready, sleeping 3s"; sleep 3;
              done
              echo "postgres is up"
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.83.14-stable
          imagePullPolicy: IfNotPresent
          args:
            - "--config"
            - "/etc/litellm/config.yaml"
            - "--port"
            - "4000"
          ports:
            - name: http
              containerPort: 4000
          # Pull OPENROUTER_API_KEY, LITELLM_MASTER_KEY, LITELLM_SALT_KEY,
          # DATABASE_URL from the litellm-secrets Secret.
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_MODE
              value: "PRODUCTION"
            - name: LITELLM_LOG
              value: "INFO"
            # Proxy pods must not run DB migrations (restart / multi-replica safe).
            - name: DISABLE_SCHEMA_UPDATE
              value: "true"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            initialDelaySeconds: 120
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
  labels:
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
