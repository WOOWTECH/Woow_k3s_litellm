# -----------------------------------------------------------------------------
# LiteLLM MCP admin console (namespace litellm-mcp), served at
# https://litellm-mcp.woowtech.io through the tunnel in 05-cloudflared.yaml.
# Source of the application: https://github.com/WOOWTECH/Woow_litellm_mcp_server
# (cloned and built by the init containers on every start).
# - Recreate strategy: the data PVC is ReadWriteOnce.
# - The Secrets only seed the first boot; afterwards /data/config.json is the
#   source of truth for the admin password, MCP token and tool toggles.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-mcp-data
  namespace: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: litellm-mcp-admin
    app.kubernetes.io/part-of: woow-litellm
  name: litellm-mcp-admin
  namespace: litellm-mcp
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-mcp-admin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: litellm-mcp-admin
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          set -eux
          pip install --no-cache-dir ".[admin]"
          exec uvicorn litellm_mcp_admin.main:app --host 0.0.0.0 --port 8080
        env:
        - name: MCP_ADMIN_CONFIG
          value: /data/config.json
        - name: JWT_EXPIRY_HOURS
          value: '12'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: litellm-mcp-admin-secret
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 20
          timeoutSeconds: 1
        name: admin
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 256Mi
        volumeMounts:
        - mountPath: /repo
          name: repo
        - mountPath: /data
          name: data
        workingDir: /repo
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -eux
          rm -rf /repo/* /repo/.git || true
          git clone --depth 1 https://github.com/WOOWTECH/Woow_litellm_mcp_server /repo
        image: alpine/git:latest
        imagePullPolicy: Always
        name: git-clone
        resources: {}
        volumeMounts:
        - mountPath: /repo
          name: repo
      - command:
        - sh
        - -c
        - "set -x\n# This step used to `cp frontend-overrides/ConnectionConfig.jsx` over\n# the page source and `sed` residual EMQX strings out of the shared\n# SPA. Both are gone on purpose: the override\
          \ silently reverted every\n# fix made to frontend/src/pages/ConnectionConfig.jsx (the running pod\n# shipped the stale copy), and the sed only masked leftover branding\n# that is now correct in\
          \ the source itself. Do NOT reintroduce either \u2014\n# frontend/src is the single source of truth for the console.\nnpm install --no-audit --no-fund && npm run build \\\n  && mkdir -p /repo/static\
          \ && cp -r dist/* /repo/static/ \\\n  || echo \"SPA build failed - admin API + proxy will still run\"\nexit 0\n"
        image: node:20-alpine
        imagePullPolicy: IfNotPresent
        name: spa-build
        resources: {}
        volumeMounts:
        - mountPath: /repo
          name: repo
        workingDir: /repo/frontend
      - command:
        - python
        - -c
        - "import json, os, pathlib\np = pathlib.Path(\"/data/config.json\")\ncfg = json.loads(p.read_text()) if p.exists() else {}\n# setdefault, NOT assignment. These two are the console's own\n# credentials\
          \ and the console can change them at runtime: the\n# Settings page changes admin_password, the Tokens page rotates\n# mcp_auth_token. Assigning here unconditionally made every pod\n# restart silently\
          \ revert both to whatever the Secret still held \u2014\n# a rotated token would keep working until the next restart and\n# then die without anyone touching it. This was FINDING-004.\n# The Secret\
          \ seeds the FIRST boot; after that /data is the truth.\ncfg.setdefault(\"admin_password\", os.environ[\"ADMIN_PASSWORD\"])\ncfg.setdefault(\"mcp_auth_token\", os.environ[\"MCP_AUTH_TOKEN\"])\n\
          # The upstream connection is different: it is infrastructure, not\n# user state, and the Secret is its source of truth. Rotating the\n# LiteLLM master key must reach the console on the next restart,\n\
          # so this one stays an assignment on purpose.\ncfg[\"connection\"] = {\n    \"litellm_mcp_base_url\": os.environ[\"LITELLM_BASE_URL\"],\n    \"litellm_mcp_master_key\": os.environ[\"LITELLM_MASTER_KEY\"\
          ],\n}\n# Preserve the child env across restarts: the Tools page writes the\n# LITELLM_MCP_* gating switches in here, and blindly resetting it to\n# {} silently un-did every GUI toggle on every\
          \ pod restart.\nprev_env = (cfg.get(\"mcp_server\") or {}).get(\"env\") or {}\ncfg[\"mcp_server\"] = {\n    \"command\": \"python\",\n    \"args\": [\"-m\", \"woow_litellm_mcp_server.server\"\
          ,\n             \"--transport\", \"http\", \"--host\", \"127.0.0.1\",\n             \"--port\", \"3000\", \"--path\", \"/mcp/\"],\n    \"port\": 3000,\n    \"env\": prev_env,\n}\ncfg.setdefault(\"\
          proxy\", {\"timeout\": 86400})\n# Canonical tools shape. `disabled` is the legacy key; migrate it into\n# disabled_tools once and drop it so the reader never sees both.\ntools = cfg.get(\"tools\"\
          ) or {}\nlegacy = tools.pop(\"disabled\", None)\nif legacy:\n    tools[\"disabled_tools\"] = sorted(\n        set(tools.get(\"disabled_tools\") or []) | set(legacy))\ntools.setdefault(\"readonly\"\
          , False)\ntools.setdefault(\"disabled_categories\", [])\ntools.setdefault(\"disabled_tools\", [])\ntools.setdefault(\"disabled_operations\", {})\nperms = tools.get(\"permissions\") or {}\nperms.setdefault(\"\
          allowed_tools\", [\"*\"])\nperms.setdefault(\"denied_tools\", [])\ntools[\"permissions\"] = perms\ncfg[\"tools\"] = tools\ncfg.setdefault(\"token_history\", [])\np.parent.mkdir(parents=True, exist_ok=True)\n\
          p.write_text(json.dumps(cfg, indent=2))\nos.chmod(p, 0o600)\nprint(\"seeded\", p)\n"
        env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: ADMIN_PASSWORD
              name: litellm-mcp-admin-secret
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: MCP_AUTH_TOKEN
              name: litellm-mcp-admin-secret
        - name: LITELLM_BASE_URL
          valueFrom:
            secretKeyRef:
              key: LITELLM_BASE_URL
              name: litellm-mcp-secret
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: LITELLM_MASTER_KEY
              name: litellm-mcp-secret
        image: python:3.12-slim
        imagePullPolicy: IfNotPresent
        name: seed-config
        resources: {}
        volumeMounts:
        - mountPath: /data
          name: data
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: repo
      - name: data
        persistentVolumeClaim:
          claimName: litellm-mcp-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: litellm-mcp-admin
    app.kubernetes.io/part-of: woow-litellm
  name: litellm-mcp-admin
  namespace: litellm-mcp
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: litellm-mcp-admin
  type: ClusterIP
