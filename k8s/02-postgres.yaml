# -----------------------------------------------------------------------------
# PostgreSQL 16 for LiteLLM: virtual keys, budgets, spend, UI-added models and
# provider credentials encrypted with LITELLM_SALT_KEY.
#
# - Headless Service: DATABASE_URL uses host litellm-postgres:5432.
# - Longhorn (Retain) 5Gi. PGDATA is a subdir because the ext4 root holds lost+found.
# - Probes hardcode litellm/litellm, so POSTGRES_USER / POSTGRES_DB must stay "litellm".
# - terminationGracePeriodSeconds 90 lets Postgres checkpoint instead of being killed.
# - NetworkPolicy: only the proxy (app=litellm) and the backup job
#   (app=litellm-backup) may reach 5432.
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: litellm-postgres
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
    app: litellm-postgres
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  clusterIP: None
  selector:
    app: litellm-postgres
  ports:
  - name: postgres
    port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: litellm-postgres
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
    app: litellm-postgres
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  serviceName: litellm-postgres
  replicas: 1
  selector:
    matchLabels:
      app: litellm-postgres
  template:
    metadata:
      labels:
        app: litellm-postgres
        app.kubernetes.io/part-of: woow-litellm
    spec:
      terminationGracePeriodSeconds: 90
      containers:
      - name: postgres
        image: docker.io/library/postgres:16-alpine
        ports:
        - name: postgres
          containerPort: 5432
        envFrom:
        - secretRef:
            name: litellm-postgres-secret
        env:
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        readinessProbe:
          exec:
            command: &id001
            - pg_isready
            - -U
            - litellm
            - -d
            - litellm
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
        livenessProbe:
          exec:
            command: *id001
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 1Gi
  volumeClaimTemplates:
  - metadata:
      name: pgdata
      labels:
        app: litellm-postgres
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: longhorn
      resources:
        requests:
          storage: 5Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-postgres-ingress
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
  annotations:
    woowtech.io/source: 'merged: Woow_litellm_docker_compose@bebf782 + live k3s spec (2026-07-23) + Woow_podman_litellm@8a478d3'
spec:
  podSelector:
    matchLabels:
      app: litellm-postgres
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: litellm
    - podSelector:
        matchLabels:
          app: litellm-backup
    ports:
    - protocol: TCP
      port: 5432
