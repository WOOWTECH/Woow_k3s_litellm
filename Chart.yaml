  - gateway
  - openai
  - openrouter
home: https://github.com/WOOWTECH/Woow_k3s_litellm
sources:
  - https://github.com/WOOWTECH/Woow_k3s_litellm
  - https://github.com/WOOWTECH/Woow_podman_litellm
  - https://github.com/BerriAI/litellm
maintainers:
  - name: WoowTech
    url: https://github.com/WOOWTECH
