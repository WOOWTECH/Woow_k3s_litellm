{{- /*
Secrets, rendered only with secrets.create=true. By default they are created
out of band from examples/secrets.example.yaml and the chart never touches
them, so an upgrade cannot overwrite real keys.
*/ -}}
{{- if .Values.secrets.create }}
{{- $s := .Values.secrets }}
{{- $pw := required "secrets.postgresPassword is required when secrets.create=true" $s.postgresPassword }}
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
  {{- include "litellm.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  OPENROUTER_API_KEY: {{ required "secrets.openrouterApiKey is required when secrets.create=true" $s.openrouterApiKey | quote }}
  LITELLM_MASTER_KEY: {{ required "secrets.masterKey is required when secrets.create=true" $s.masterKey | quote }}
  LITELLM_SALT_KEY: {{ required "secrets.saltKey is required when secrets.create=true" $s.saltKey | quote }}
  DATABASE_URL: {{ printf "postgresql://litellm:%s@litellm-postgres:5432/litellm" $pw | quote }}
  {{- range $k, $v := $s.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-postgres-secret
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
  {{- include "litellm.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  # The probes hardcode user and database "litellm".
  POSTGRES_USER: "litellm"
  POSTGRES_PASSWORD: {{ $pw | quote }}
  POSTGRES_DB: "litellm"
{{- if .Values.cloudflared.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
  {{- include "litellm.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  TUNNEL_TOKEN: {{ required "secrets.tunnelToken is required when secrets.create=true and cloudflared.enabled=true" $s.tunnelToken | quote }}
{{- end }}
{{- end }}
