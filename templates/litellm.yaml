{{- /*
LiteLLM proxy: OpenAI-compatible API on :4000, Admin UI at /ui.
- config/config.yaml is read straight from the chart; there is no second copy.
  A config change alone does not restart the pod:
    kubectl -n litellm rollout restart deploy/litellm
- DISABLE_SCHEMA_UPDATE=false: the proxy runs `prisma migrate deploy` on start.
  With "true" an empty database never gets its tables. With one replica and
  maxSurge 1, only the new pod migrates.
- startupProbe allows up to 40 x 15s = 10 min for first-boot migrations.
- Never probe /health: it calls every configured model and costs money.
*/ -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
    app: litellm
data:
  config.yaml: {{ .Files.Get "config/config.yaml" | toJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
    app: litellm
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: litellm
        {{- include "litellm.partOf" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        # pg_isready (service-level), not a bare TCP check.
        - name: wait-for-postgres
          image: {{ include "litellm.postgresImage" . }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h litellm-postgres -p 5432 -U litellm -d litellm; do
                echo "waiting for postgres..."; sleep 3;
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: litellm
          image: {{ .Values.litellm.image.repository }}:{{ .Values.litellm.image.tag }}
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_MODE
              value: PRODUCTION
            - name: LITELLM_LOG
              value: {{ .Values.litellm.logLevel | quote }}
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
