{{- /*
LiteLLM proxy: OpenAI-compatible API on :4000, Admin UI at /ui.
- config/config.yaml is read straight from the chart; there is no second copy.
  A config change alone does not restart the pod:
    kubectl -n litellm rollout restart deploy/litellm
- DISABLE_SCHEMA_UPDATE=false: the proxy runs `prisma migrate deploy` on start.
  With "true" an empty database never gets its tables. With one replica and
  maxSurge 1, only the new pod migrates.
- startupProbe allows up to 40 x 15s = 10 min for first-boot migrations.
- Never probe /health: it calls every configured model and costs money.
*/ -}}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
    app: litellm
data:
  config.yaml: {{ .Files.Get "config/config.yaml" | toJson }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
    app: litellm
spec:
  replicas: {{ .Values.litellm.replicas }}
  selector:
    matchLabels:
      app: litellm
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: litellm
        {{- include "litellm.partOf" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      initContainers:
        # pg_isready (service-level), not a bare TCP check.
        - name: wait-for-postgres
          image: {{ include "litellm.postgresImage" . }}
          command:
            - sh
            - -c
            - |
              until pg_isready -h litellm-postgres -p 5432 -U litellm -d litellm; do
                echo "waiting for postgres..."; sleep 3;
              done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: litellm
          image: {{ include "litellm.litellmImage" . }}
          imagePullPolicy: {{ .Values.litellm.image.pullPolicy }}
          args: [--config, /etc/litellm/config.yaml, --port, "4000"]
          ports:
            - name: http
              containerPort: 4000
          envFrom:
            - secretRef:
                name: litellm-secrets
          env:
            - name: STORE_MODEL_IN_DB
              value: "True"
            - name: LITELLM_MODE
              value: PRODUCTION
            - name: LITELLM_LOG
              value: {{ .Values.litellm.logLevel | quote }}
            - name: DISABLE_SCHEMA_UPDATE
              value: "false"
          volumeMounts:
            - name: config
              mountPath: /etc/litellm
              readOnly: true
          startupProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 40
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: 4000
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: 4000
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.litellm.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: litellm-config
            items:
              - key: config.yaml
                path: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
    app: litellm
spec:
  type: ClusterIP
  selector:
    app: litellm
  ports:
    - name: http
      port: 4000
      targetPort: 4000
{{- /*
Restrict who may reach the proxy on :4000. The baseline cluster leaves most
namespaces without a NetworkPolicy, so without this every pod in the cluster
can open a TCP session straight to the litellm pod with an attacker-controlled
Host header - the in-cluster vector for CVE-2026-49468 (Host-header auth
bypass) and CVE-2026-59822 (unauthenticated MCP). Only cloudflared (the public
tunnel), the `helm test` smoke pod and the litellm-mcp namespace (the admin
console) are allowed in. Defence in depth, not a substitute for the version bump.
*/ -}}
{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.restrictProxyIngress }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: litellm-ingress
  namespace: {{ include "litellm.ns" . }}
  labels:
    {{- include "litellm.partOf" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: litellm
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: cloudflared
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: smoke-test
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: litellm-mcp
      ports:
        - port: 4000
          protocol: TCP
{{- end }}
