{{- /*
LiteLLM MCP admin console, served at https://litellm-mcp.woowtech.io through the
tunnel. The application is https://github.com/WOOWTECH/Woow_litellm_mcp_server,
cloned and built by the init containers on every start.
- Recreate strategy: the data PVC is ReadWriteOnce.
- The Secrets only seed the first boot; afterwards /data/config.json is the
  source of truth for the admin password, MCP token and tool toggles.
- The init scripts are kept verbatim from the deployed spec.
*/ -}}
{{- if .Values.mcp.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: litellm-mcp-data
  namespace: {{ include "litellm.mcpNs" . }}
  labels:
    app.kubernetes.io/part-of: woow-litellm
  {{- include "litellm.keepAnnotations" . | nindent 2 }}
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: {{ include "litellm.storageClass" (list . .Values.mcp.storage.className) }}
  resources:
    requests:
      storage: {{ .Values.mcp.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: litellm-mcp-admin
    app.kubernetes.io/part-of: woow-litellm
  name: litellm-mcp-admin
  namespace: {{ include "litellm.mcpNs" . }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm-mcp-admin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: litellm-mcp-admin
    spec:
      containers:
      - command:
        - sh
        - -c
        - |
          set -eux
          pip install --no-cache-dir ".[admin]"
          exec uvicorn litellm_mcp_admin.main:app --host 0.0.0.0 --port 8080
        env:
        - name: MCP_ADMIN_CONFIG
          value: /data/config.json
        - name: JWT_EXPIRY_HOURS
          value: '12'
        - name: PYTHONUNBUFFERED
          value: '1'
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: litellm-mcp-admin-secret
        image: {{ .Values.mcp.images.python }}
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 6
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 180
          periodSeconds: 20
          timeoutSeconds: 1
        name: admin
        ports:
        - containerPort: 8080
          name: http
        readinessProbe:
          failureThreshold: 30
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 1
        resources:
          {{- toYaml .Values.mcp.resources | nindent 10 }}
        volumeMounts:
        - mountPath: /repo
          name: repo
        - mountPath: /data
          name: data
        workingDir: /repo
      initContainers:
      - command:
        - sh
        - -c
        - |
          set -eux
          rm -rf /repo/* /repo/.git || true
          git clone --depth 1 {{ .Values.mcp.gitRepo }} /repo
        image: {{ .Values.mcp.images.git }}
        imagePullPolicy: Always
        name: git-clone
        resources: {}
        volumeMounts:
        - mountPath: /repo
          name: repo
      - command:
        - sh
        - -c
        - |
          set -x
          # This step used to `cp frontend-overrides/ConnectionConfig.jsx` over
          # the page source and `sed` residual EMQX strings out of the shared
          # SPA. Both are gone on purpose: the override silently reverted every
          # fix made to frontend/src/pages/ConnectionConfig.jsx (the running pod
          # shipped the stale copy), and the sed only masked leftover branding
          # that is now correct in the source itself. Do NOT reintroduce either —
          # frontend/src is the single source of truth for the console.
          npm install --no-audit --no-fund && npm run build \
            && mkdir -p /repo/static && cp -r dist/* /repo/static/ \
            || echo "SPA build failed - admin API + proxy will still run"
          exit 0
        image: {{ .Values.mcp.images.node }}
        imagePullPolicy: IfNotPresent
        name: spa-build
        resources: {}
        volumeMounts:
        - mountPath: /repo
          name: repo
        workingDir: /repo/frontend
      - command:
        - python
        - -c
        - |
          import json, os, pathlib
          p = pathlib.Path("/data/config.json")
          cfg = json.loads(p.read_text()) if p.exists() else {}
          # setdefault, NOT assignment. These two are the console's own
          # credentials and the console can change them at runtime: the
          # Settings page changes admin_password, the Tokens page rotates
          # mcp_auth_token. Assigning here unconditionally made every pod
          # restart silently revert both to whatever the Secret still held —
          # a rotated token would keep working until the next restart and
          # then die without anyone touching it. This was FINDING-004.
          # The Secret seeds the FIRST boot; after that /data is the truth.
          cfg.setdefault("admin_password", os.environ["ADMIN_PASSWORD"])
          cfg.setdefault("mcp_auth_token", os.environ["MCP_AUTH_TOKEN"])
          # The upstream connection is different: it is infrastructure, not
          # user state, and the Secret is its source of truth. Rotating the
          # LiteLLM master key must reach the console on the next restart,
          # so this one stays an assignment on purpose.
          cfg["connection"] = {
              "litellm_mcp_base_url": os.environ["LITELLM_BASE_URL"],
              "litellm_mcp_master_key": os.environ["LITELLM_MASTER_KEY"],
          }
          # Preserve the child env across restarts: the Tools page writes the
          # LITELLM_MCP_* gating switches in here, and blindly resetting it to
          # {} silently un-did every GUI toggle on every pod restart.
          prev_env = (cfg.get("mcp_server") or {}).get("env") or {}
          cfg["mcp_server"] = {
              "command": "python",
              "args": ["-m", "woow_litellm_mcp_server.server",
                       "--transport", "http", "--host", "127.0.0.1",
                       "--port", "3000", "--path", "/mcp/"],
              "port": 3000,
              "env": prev_env,
          }
          cfg.setdefault("proxy", {"timeout": 86400})
          # Canonical tools shape. `disabled` is the legacy key; migrate it into
          # disabled_tools once and drop it so the reader never sees both.
          tools = cfg.get("tools") or {}
          legacy = tools.pop("disabled", None)
          if legacy:
              tools["disabled_tools"] = sorted(
                  set(tools.get("disabled_tools") or []) | set(legacy))
          tools.setdefault("readonly", False)
          tools.setdefault("disabled_categories", [])
          tools.setdefault("disabled_tools", [])
          tools.setdefault("disabled_operations", {})
          perms = tools.get("permissions") or {}
          perms.setdefault("allowed_tools", ["*"])
          perms.setdefault("denied_tools", [])
          tools["permissions"] = perms
          cfg["tools"] = tools
          cfg.setdefault("token_history", [])
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(json.dumps(cfg, indent=2))
          os.chmod(p, 0o600)
          print("seeded", p)
        env:
        - name: ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              key: ADMIN_PASSWORD
              name: litellm-mcp-admin-secret
        - name: MCP_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              key: MCP_AUTH_TOKEN
              name: litellm-mcp-admin-secret
        - name: LITELLM_BASE_URL
          valueFrom:
            secretKeyRef:
              key: LITELLM_BASE_URL
              name: litellm-mcp-secret
        - name: LITELLM_MASTER_KEY
          valueFrom:
            secretKeyRef:
              key: LITELLM_MASTER_KEY
              name: litellm-mcp-secret
        image: {{ .Values.mcp.images.python }}
        imagePullPolicy: IfNotPresent
        name: seed-config
        resources: {}
        volumeMounts:
        - mountPath: /data
          name: data
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir: {}
        name: repo
      - name: data
        persistentVolumeClaim:
          claimName: litellm-mcp-data
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: litellm-mcp-admin
    app.kubernetes.io/part-of: woow-litellm
  name: litellm-mcp-admin
  namespace: {{ include "litellm.mcpNs" . }}
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: litellm-mcp-admin
  type: ClusterIP
{{- end }}
