# -----------------------------------------------------------------------------
# Secrets for Woow_k3s_litellm - PLACEHOLDERS ONLY. Never commit real values.
#
# This file lives outside k8s/ on purpose, so `kubectl apply -f k8s/` can never
# overwrite the real Secrets with placeholders. Copy it OUTSIDE the repo,
# replace every REPLACE_ME value, then apply that copy:
#   kubectl --context woow-k3s apply -f /secure/path/secrets.yaml
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  # Used by every model in config/config.yaml (os.environ/OPENROUTER_API_KEY).
  OPENROUTER_API_KEY: "REPLACE_ME_sk-or-..."
  # Admin API credential and Admin UI password (user: admin).
  LITELLM_MASTER_KEY: "REPLACE_ME_sk-..."
  # Encrypts provider credentials stored in the DB. SET ONCE, NEVER ROTATE.
  # Back it up outside the cluster: DB backups are useless without it.
  LITELLM_SALT_KEY: "REPLACE_ME_sk-..."
  # Password must equal POSTGRES_PASSWORD below.
  DATABASE_URL: "postgresql://litellm:REPLACE_ME_PG_PASSWORD@litellm-postgres:5432/litellm"
  # Present in the running Secret but not referenced by config/config.yaml;
  # available to models added through the Admin UI or direct-provider entries.
  OPENAI_API_KEY: "REPLACE_ME_optional"
  ZAI_API_KEY: "REPLACE_ME_optional"
  MINIMAX_API_KEY: "REPLACE_ME_optional"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-postgres-secret
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  # The probes in k8s/02-postgres.yaml hardcode user and database "litellm".
  POSTGRES_USER: "litellm"
  POSTGRES_PASSWORD: "REPLACE_ME_PG_PASSWORD"
  POSTGRES_DB: "litellm"
---
apiVersion: v1
kind: Secret
metadata:
  name: cloudflared-token
  namespace: litellm
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  # Token of the existing tunnel serving litellm.woowtech.io and litellm-mcp.woowtech.io.
  TUNNEL_TOKEN: "REPLACE_ME_CLOUDFLARE_TUNNEL_TOKEN"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-secret
  namespace: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  LITELLM_BASE_URL: "http://litellm.litellm.svc.cluster.local:4000"
  # Must equal LITELLM_MASTER_KEY in litellm-secrets.
  LITELLM_MASTER_KEY: "REPLACE_ME_sk-..."
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
---
apiVersion: v1
kind: Secret
metadata:
  name: litellm-mcp-admin-secret
  namespace: litellm-mcp
  labels:
    app.kubernetes.io/part-of: woow-litellm
type: Opaque
stringData:
  # First-boot seeds only; the console can change them at runtime.
  ADMIN_PASSWORD: "REPLACE_ME_ADMIN_PASSWORD"
  MCP_AUTH_TOKEN: "REPLACE_ME_MCP_AUTH_TOKEN"
  JWT_SECRET: "REPLACE_ME_JWT_SECRET"
