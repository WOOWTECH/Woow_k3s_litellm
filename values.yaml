# Default values for the litellm chart.
# Defaults reproduce the woow-k3s deployment 1:1 (deploy/woow-k3s/litellm.yaml
# restates them): namespace litellm, Longhorn storage, Cloudflare Tunnel, daily
# backups. The LiteLLM MCP admin console is NOT part of this chart; it is its
# own chart and release in WOOWTECH/Woow_litellm_mcp_server.

namespace:
  # Render the Namespace objects. A namespace equal to the release namespace
  # (`-n`) is never rendered - create it with --create-namespace instead - so
  # `helm uninstall` can never delete the namespace the release lives in.
  create: true
  name: ""

# Add `helm.sh/resource-policy: keep` to Namespaces, PVCs and chart-created
# Secrets, so `helm uninstall` never deletes data or LITELLM_SALT_KEY.
keepOnUninstall: true

# Default StorageClass for every PVC. Longhorn "longhorn" uses reclaimPolicy Retain.
storageClassName: longhorn

secrets:
  # false (default): the Secrets already exist (created from
  #   examples/secrets.example.yaml) and the chart never renders them, so a
  #   `helm upgrade` can never overwrite real keys with empty values.
  # true: render every Secret from the values below (fresh installs, tests).
  create: false
  openrouterApiKey: ""
  masterKey: ""
  # Encrypts provider credentials stored in the DB. SET ONCE, NEVER ROTATE.
  saltKey: ""
  # Letters and digits only: it is embedded verbatim in DATABASE_URL.
  postgresPassword: ""
  tunnelToken: ""
  # Extra keys for litellm-secrets, e.g. OPENAI_API_KEY, ZAI_API_KEY, MINIMAX_API_KEY.
  extraEnv: {}

litellm:
  image:
    repository: ghcr.io/berriai/litellm
    # 1.84.0 onward drops the "-stable"/"-nightly" suffixes (pure SemVer). This
    # pins the root image variant (unchanged from the previous deployment).
    tag: "1.103.3"
    # Multi-arch index digest for tag 1.103.3 (what the kubelet pulls). Verify
    # before bumping: see docs/security and the PR that introduced this value.
    #   cosign verify --key <BerriAI cosign.pub> ghcr.io/berriai/litellm@<digest>
    digest: sha256:e6e1c46cec92ab58b7ff95c790420aba9f05269b662a66c0dd11714171b9c64b
    pullPolicy: IfNotPresent
  replicas: 1
  # ERROR is the quiet production baseline; INFO is what the CLI calls --debug.
  logLevel: ERROR
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

postgres:
  image:
    repository: docker.io/library/postgres
    # Keep PostgreSQL on the 16 line (do NOT bump the major version: a major
    # upgrade needs a dump/restore, not an in-place pod swap). The floating
    # `16-alpine` tag is pinned to the exact multi-arch index digest the live
    # release is already running (Postgres 16.14), so an upgrade of the gateway
    # never silently restarts the database pod onto a newer base image.
    tag: 16-alpine
    digest: sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
  storage:
    # "" = use storageClassName
    className: ""
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

networkPolicy:
  # Master switch for every NetworkPolicy this chart renders.
  # When enabled, only the proxy (app=litellm) and the backup job
  # (app=litellm-backup) may reach Postgres.
  enabled: true
  # Also lock down ingress to the proxy on :4000 (NetworkPolicy litellm-ingress):
  # only cloudflared, the `helm test` smoke pod and the litellm-mcp namespace may
  # connect. Closes the in-cluster vector for the Host-header auth bypass
  # (CVE-2026-49468) and unauthenticated MCP (CVE-2026-59822). Keep this on.
  restrictProxyIngress: true

cloudflared:
  # Only ONE deployment may run a given tunnel token; a second set of
  # connectors splits traffic. Disable for test installs.
  enabled: true
  replicas: 2
  image:
    repository: cloudflare/cloudflared
    tag: latest
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

backup:
  enabled: true
  schedule: "15 3 * * *"
  timeZone: Asia/Taipei
  retentionDays: 14
  storage:
    # "" = use storageClassName
    className: ""
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

tests:
  # `helm test` smoke pod: liveness, readiness + DB, model list. Read-only.
  enabled: true
